    Projects:
      - name: CSS StudentHub Digital Hub Prototype (COMP8280)
        url: https://kevinzzzhu.github.io/projects/28_project/
        start_date: 2026-02
        end_date: 2026-06
        summary: Designed and implemented a navigable HTML/CSS/JavaScript prototype for a hybrid CSS Student Hub, with role-aware entry, an interactive Hub map, event filters, detail panels, subscriptions, and an event proposal flow.
        highlights:
          - Translated research insights into user journeys for students, staff, partners, researchers, and future students.
          - Presented the concept through a poster and client-facing presentation to CSS stakeholders, including the client and Dean of CSS.
          - Applied HCI methods such as affinity mapping, personas, storyboarding, and iterative refinement.

      - name: "PickNPlay: UX Design, Implementation and Evaluation for a Social Choice Board Game App"
        url: https://kevinzzzhu.github.io/projects/1_project/
        start_date: 2025-07
        end_date: 2026-07
        summary: Master's advanced individual research project researching and developing a web-based board game selection system that combines HCI evaluation with machine-learning-supported recommendation and decision-making workflows.
        highlights:
          - Building the system with a React front end, Python backend components, and computer-vision-supported interaction flows for capturing board game information and supporting user choice.
          - Focused on iterative UX evaluation, accessible interaction design, and making recommendation results understandable to non-technical users.

      - name: IMPSY Interactive Machine Learning Interface
        url: https://kevinzzzhu.github.io/projects/impsy-interface/
        start_date: 2024-07
        end_date: 2025-06
        summary: Honours individual research project developing a user-centred web interface for the interactive machine learning tool IMPSY, improving how musicians and researchers inspect, compare, and work with model outputs.
        highlights:
          - Built using React, Flask, and D3.js, with a focus on responsive UI behaviour, interactive data visualisation, and clear user journeys for complex ML concepts.
          - Project output accepted to the NIME 2026 Conference.

